services:
  - type: web
    name: pillcount-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: AUTH_USERNAME
        value: pharmacy
      - key: AUTH_PASSWORD
        sync: false
      # Render's free plan is a slow, shared, memory-limited CPU — full
      # accuracy settings (TTA + tiling at 1280px) can take long enough on a
      # ~4000px phone photo to trip the platform's request timeout. Trading
      # some accuracy on dense/overlapping trays for requests that reliably
      # complete. Remove these overrides if/when this moves to a paid plan.
      - key: TTA_AUGMENT
        value: "false"
      - key: INFERENCE_IMGSZ
        value: "960"
      # Same reasoning — these each roughly double inference cost on their
      # own (and compound when combined), which is fine on real hardware but
      # risks tripping the free tier's request timeout. Remove these
      # overrides too once off the free plan.
      - key: MULTI_SCALE_FUSION
        value: "false"
      - key: FULL_PASS_UNION
        value: "false"
      - key: DENSE_RECROP_ENABLED
        value: "false"
      # Ensemble mode runs the whole tiled pipeline twice (once per model) —
      # the one remaining 2x-cost path even with everything above disabled.
      # A client with "ensemble" persisted from earlier A/B testing would
      # otherwise silently double the cost of every request on this
      # hardware. Disabling it server-side makes requests fall back to the
      # default single model instead of running (or hanging) at 2x cost.
      - key: ENSEMBLE_ENABLED
        value: "false"
      # The instance was hitting Render's 512MB memory ceiling. Two
      # contributors: get_model()'s lru_cache holding multiple full YOLO
      # models resident at once (a client flipping v2/v3), and large decoded
      # images (up to 6000px from the frontend) each carrying several
      # hundred MB of tiled/multi-scale working buffers per in-flight
      # request. Capping the model cache to 1, the image dimension lower,
      # and inference to a single worker at a time bounds peak memory to
      # roughly one model + one request's buffers. Remove these overrides
      # once off the free plan.
      - key: MODEL_CACHE_SIZE
        value: "1"
      - key: MAX_IMAGE_DIMENSION
        value: "3000"
      - key: INFERENCE_MAX_WORKERS
        value: "1"
      # Belt-and-suspenders: if a photo is unusually dense/large and still
      # runs long, fail fast with a clear, retryable error well before the
      # client's own 120s upload timeout gives up silently.
      - key: INFERENCE_TIMEOUT_SECONDS
        value: "90"
