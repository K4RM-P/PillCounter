services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - AUTH_USERNAME=${AUTH_USERNAME:-pharmacy}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-changeme}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-production}

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
